mutation CreateGoodboochStockTransaction(
  $productSku: String!
  $transactionType: String!
  $transactionDate: Date!
  $quantityChange: Int!
  $unitText: String!
  $noteText: String
) @auth(expr: "auth.token.email == 'anawatbooch@gmail.com'") {
  goodboochStockTransaction_insert(data: {
    productSku: $productSku
    transactionType: $transactionType
    transactionDate: $transactionDate
    quantityChange: $quantityChange
    unitText: $unitText
    noteText: $noteText
    createdByUid_expr: "auth.uid"
    createdAt_expr: "request.time"
  })
}
