query ListGoodboochProducts($limit: Int = 1000, $offset: Int = 0)
  @auth(expr: "auth.token.email == 'anawatbooch@gmail.com'") {
  goodboochProducts(limit: $limit, offset: $offset, orderBy: { sku: ASC }) {
    sku
    productName
    inventoryMethod
    baseUnit
    lowStockThreshold
    idealGlobeProductCode
    noteText
    isActive
    createdAt
    updatedAt
  }
}

query GetGoodboochProduct($sku: String!)
  @auth(expr: "auth.token.email == 'anawatbooch@gmail.com'") {
  goodboochProduct(key: { sku: $sku }) {
    sku
    productName
    inventoryMethod
    baseUnit
    lowStockThreshold
    idealGlobeProductCode
    noteText
    isActive
    createdAt
    updatedAt
  }
}
