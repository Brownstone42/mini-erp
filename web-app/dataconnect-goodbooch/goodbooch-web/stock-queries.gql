query ListGoodboochStockTransactions($limit: Int = 1000, $offset: Int = 0)
  @auth(expr: "auth.token.email == 'anawatbooch@gmail.com'") {
  goodboochStockTransactions(limit: $limit, offset: $offset, orderBy: { createdAt: DESC }) {
    id
    productSku
    transactionType
    transactionDate
    quantityChange
    unitText
    noteText
    createdByUid
    createdAt
  }
}
