query ListGoodboochStockTransactions($limit: Int = 1000, $offset: Int = 0)
  @auth(level: USER, insecureReason: "Goodbooch stock transactions are readable only by authenticated ERP users.") {
  goodboochStockTransactions(limit: $limit, offset: $offset, orderBy: { createdAt: DESC }) {
    id
    productSku
    transactionType
    transactionDate
    quantityChange
    unitText
    noteText
    createdByUid
    createdAt
  }
}
