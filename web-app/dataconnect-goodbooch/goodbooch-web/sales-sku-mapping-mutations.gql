mutation CreateGoodboochSalesSkuMapping(
  $shopCode: String!
  $shopeeSku: String!
  $listingName: String
  $variantName: String
  $productSku: String!
  $stockEffect: String!
  $quantityPerOrder: Int!
) @auth(expr: "auth.token.email == 'anawatbooch@gmail.com'") {
  goodboochSalesSkuMapping_insert(data: {
    shopCode: $shopCode
    shopeeSku: $shopeeSku
    listingName: $listingName
    variantName: $variantName
    productSku: $productSku
    stockEffect: $stockEffect
    quantityPerOrder: $quantityPerOrder
    isActive: true
    createdByUid_expr: "auth.uid"
    createdAt_expr: "request.time"
    updatedAt_expr: "request.time"
  })
}

mutation UpdateGoodboochSalesSkuMapping(
  $id: UUID!
  $shopCode: String!
  $shopeeSku: String!
  $listingName: String
  $variantName: String
  $productSku: String!
  $stockEffect: String!
  $quantityPerOrder: Int!
  $isActive: Boolean!
) @auth(expr: "auth.token.email == 'anawatbooch@gmail.com'") {
  goodboochSalesSkuMapping_update(key: { id: $id }, data: {
    shopCode: $shopCode
    shopeeSku: $shopeeSku
    listingName: $listingName
    variantName: $variantName
    productSku: $productSku
    stockEffect: $stockEffect
    quantityPerOrder: $quantityPerOrder
    isActive: $isActive
    updatedAt_expr: "request.time"
  })
}
