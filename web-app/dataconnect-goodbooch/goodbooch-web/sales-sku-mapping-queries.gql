query ListGoodboochSalesSkuMappings($limit: Int = 1000, $offset: Int = 0)
  @auth(expr: "auth.token.email == 'anawatbooch@gmail.com'") {
  goodboochSalesSkuMappings(limit: $limit, offset: $offset, orderBy: { updatedAt: DESC }) {
    id
    shopCode
    shopeeSku
    listingName
    variantName
    productSku
    stockEffect
    quantityPerOrder
    isActive
    createdAt
    updatedAt
  }
}
