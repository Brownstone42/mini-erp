mutation CreateSignatory(
  $id: UUID!
  $fullName: String!
  $phoneText: String
  $email: String @retired(reason: "Email now comes from the authenticated Firebase user token.")
  $signaturePath: String
  $stampPath: String
) @auth(level: USER) {
  signatory_insert(data: {
    id: $id
    fullName: $fullName
    phoneText: $phoneText
    email_expr: "auth.token.email"
    signaturePath: $signaturePath
    stampPath: $stampPath
    isActive: true
    createdByUid_expr: "auth.uid"
    createdAt_expr: "request.time"
    updatedAt_expr: "request.time"
  })
}

mutation SetSignatoryActive($id: UUID!, $isActive: Boolean!)
  @auth(level: USER) {
  signatory_updateMany(
    where: { id: { eq: $id }, createdByUid: { eq_expr: "auth.uid" } }
    data: { isActive: $isActive, updatedAt_expr: "request.time" }
  )
}
