query LatestQuotationForMonth($rangeStart: String!, $rangeEnd: String!)
  @auth(expr: "auth.token.firebase.sign_in_provider != 'anonymous' && auth.token.email != 'idealglobe.account@gmail.com'") {
  quotations(
    where: { quotationNumber: { ge: $rangeStart, le: $rangeEnd } }
    limit: 1
    orderBy: { quotationNumber: DESC }
  ) {
    quotationNumber
  }
}

query ListQuotations($limit: Int = 100, $offset: Int = 0)
  @auth(expr: "auth.token.firebase.sign_in_provider != 'anonymous' && auth.token.email != 'idealglobe.account@gmail.com'") {
  quotations(limit: $limit, offset: $offset, orderBy: { quotationNumber: DESC }) {
    quotationNumber quotationDate customerCode customerName totalAmount createdAt
  }
}

query GetQuotation($quotationNumber: String!)
  @auth(expr: "auth.token.firebase.sign_in_provider != 'anonymous' && auth.token.email != 'idealglobe.account@gmail.com'") {
  quotation(key: { quotationNumber: $quotationNumber }) {
    quotationNumber quotationDate customerCode customerName
    addressText email phoneText signatoryId remarkText includesShipping shippingAmount totalAmount createdAt
  }
  lines: quotationLines(
    where: { quotationNumber: { eq: $quotationNumber } }
    limit: 1000
    orderBy: { lineNumber: ASC }
  ) {
    lineNumber productCode description unitText quantity unitPrice lineTotal
  }
}

query GetQuotationByRequestId($requestId: UUID!)
  @auth(expr: "auth.token.firebase.sign_in_provider != 'anonymous' && auth.token.email != 'idealglobe.account@gmail.com'") {
  quotations(where: { requestId: { eq: $requestId } }, limit: 1) {
    quotationNumber
  }
}
