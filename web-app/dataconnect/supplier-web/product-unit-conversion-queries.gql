query ListProductUnitConversions($limit: Int = 2000, $offset: Int = 0)
  @auth(level: USER, insecureReason: "Unit conversions are shared Master Data for authenticated ERP users.") {
  productUnitConversions(limit: $limit, offset: $offset, orderBy: [{ productCode: ASC }, { sourceUnitText: ASC }]) {
    productCode sourceUnitKey sourceUnitText baseUnitText baseQuantityPerSourceUnit noteText updatedAt
  }
  universalUnitConversions(limit: 100, orderBy: { sourceUnitText: ASC }) {
    sourceUnitKey sourceUnitText baseUnitText baseQuantityPerSourceUnit noteText updatedAt
  }
}
